services:
  plex:
    container_name: plex
    image: plexinc/pms-docker:latest
    # Host networking so Plex sees real client LAN IPs (bridge NAT makes local
    # clients look remote). Ports below are used directly on the host:
    # 32400/tcp, 3005, 8324, 32410-32414/udp (GDM), 32469 (DLNA)
    network_mode: host
    environment:
      - PLEX_UID=1026
      - PLEX_GID=100
      - UMASK=022
      - TZ=Europe/London
      - VERSION=latest
    devices:
      - /dev/dri:/dev/dri # Intel iGPU
    volumes:
      - /volume1/docker/appdata/plex:/config:rw
      - /volume1/data/media:/mnt/media:ro
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker/plex_transcode:/transcode
    labels:
      - autoheal=true
    restart: unless-stopped
    # xteve (IPTV proxy for Plex) lives in download-stack so it can run behind gluetun's VPN
