services:
  plex:
    container_name: plex
    image: plexinc/pms-docker:latest
    # Host networking so Plex sees real client LAN IPs (bridge NAT makes local
    # clients look remote). Ports below are used directly on the host:
    # 32400/tcp, 3005, 8324, 32410-32414/udp (GDM), 32469 (DLNA)
    network_mode: host
    environment:
      - PLEX_UID=1026
      - PLEX_GID=100
      - UMASK=022
      - TZ=Europe/London
      - VERSION=latest
    devices:
      - /dev/dri:/dev/dri # Intel iGPU
    volumes:
      - /volume1/docker/appdata/plex:/config:rw
      - /volume1/data/media:/mnt/media:ro
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker/plex_transcode:/transcode
    labels:
      - autoheal=true
    restart: unless-stopped

  # IPTV proxy: merges your M3U playlist and XMLTV guide and looks like an HDHomeRun tuner to Plex.
  # Set up at http://192.168.1.150:34400/web/ then add it in Plex: Live TV & DVR > Set up > 192.168.1.150:34400
  xteve:
    container_name: xteve
    image: alturismo/xteve:latest
    ports:
      - 34400:34400
    environment:
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/xteve:/config
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp/xteve # stream buffer, kept in RAM so it does not wear the disks
    labels:
      - autoheal=true
    restart: unless-stopped
