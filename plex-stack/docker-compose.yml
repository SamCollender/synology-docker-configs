services:
  plex:
    container_name: plex
    image: plexinc/pms-docker:latest
    # Host networking so Plex sees real client LAN IPs (bridge NAT makes local
    # clients look remote). Ports below are used directly on the host:
    # 32400/tcp, 3005, 8324, 32410-32414/udp (GDM), 32469 (DLNA)
    network_mode: host
    environment:
      - PLEX_UID=1026
      - PLEX_GID=100
      - UMASK=022
      - TZ=Europe/London
      - VERSION=latest
    devices:
      - /dev/dri:/dev/dri # Intel iGPU
    volumes:
      - /volume1/docker/appdata/plex:/config:rw
      - /volume1/data/media:/mnt/media:ro
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker/plex_transcode:/transcode
      - /volume1/data/media/recordings:/recordings:rw # Live TV / DVR recordings (the rest of /mnt/media stays read-only)
    labels:
      - autoheal=true
    restart: unless-stopped
    # threadfin (IPTV proxy for Plex) lives in download-stack so it can run behind gluetun's VPN

  # Private remote access: puts the NAS on your Tailscale network, so with Tailscale switched on your phone can
  # open Seerr at http://samnas:5055 (or the NAS's 100.x address) from anywhere. Nothing is exposed to the internet.
  # Userspace mode (no tun device / extra privileges). The one-time join key is read from
  # /volume1/docker/appdata/tailscale-nas/secrets/authkey (not in git) and is not needed after the first start.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: samnas
    network_mode: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /run/secrets/authkey ]; then export TS_AUTHKEY="$$(cat /run/secrets/authkey)"; fi
        exec /usr/local/bin/containerboot
    environment:
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=samnas
      - TS_ACCEPT_DNS=false
    volumes:
      - /volume1/docker/appdata/tailscale-nas:/var/lib/tailscale
      - /volume1/docker/appdata/tailscale-nas/secrets:/run/secrets:ro
    restart: unless-stopped
