services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=Europe/London
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - OPENVPN_PROCESS_USER=root # VPN reconnects fail with "Cannot open TUN/TAP dev: Permission denied" as nonroot
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24 # let prowlarr (behind gluetun) reach sonarr/radarr on the LAN
    ports:
      - 8088:8088 # QBitTorrent GUI
      - 6881:6881 # QBitTorrent Torrents
      - 6881:6881/udp # QBitTorrent Torrents
      - 8080:8080 # Sabnzbd
      - 9696:9696 # Prowlarr
      - 34400:34400 # Threadfin (IPTV proxy for Plex)
    restart: unless-stopped
    labels:
      - autoheal=true
    privileged: true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    healthcheck:
      test: /gluetun-entrypoint healthcheck
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun # service: (not container:) so compose recreates this when gluetun is recreated
    environment:
      - UMASK=022
      - TZ=Europe/London
      - WEBUI_PORT=8088
      - TORRENTING_PORT=6881
    volumes:
      - /volume1/docker/appdata/qbittorrent:/config
      - /volume1/data/media:/mnt/media
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    healthcheck: # fails when the shared gluetun network is gone, so autoheal restarts it
      test: curl -fsS -m 5 -o /dev/null https://1.1.1.1 || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: service:gluetun
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/sabnzbd:/config
      - /volume1/data/media:/mnt/media
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null https://1.1.1.1 || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - 7878:7878
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/radarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    labels:
      - autoheal=true
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null http://localhost:7878/ping || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
  
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release
    ports:
      - 8989:8989
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/sonarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    labels:
      - autoheal=true
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null http://localhost:8989/ping || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    ports:
      - 6767:6767
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/bazarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    network_mode: service:gluetun
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/prowlarr:/config:rw
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null https://1.1.1.1 || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    # Shares gluetun's network so Prowlarr (also behind gluetun) can reach it at http://localhost:8191
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      - 5055:5055
    environment:
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/overseerr:/app/config # existing Overseerr config, owned by 1000:1000
    labels:
      - autoheal=true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # IPTV proxy (maintained xTeVe fork with playlist filtering): merges your M3U playlist and XMLTV guide
  # and looks like an HDHomeRun tuner to Plex. Runs inside gluetun's network so IPTV streams go through
  # the VPN (port 34400 is published on gluetun).
  # Set up at http://192.168.1.150:34400/web/ then add it in Plex: Live TV & DVR > Set up > 192.168.1.150:34400
  threadfin:
    container_name: threadfin
    image: fyb3roptik/threadfin:latest
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/threadfin:/home/threadfin/conf
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp/threadfin # stream buffer, kept in RAM so it does not wear the disks
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    restart: unless-stopped

  # Restarts any container labelled autoheal=true when its healthcheck reports unhealthy,
  # and posts to Discord when it does. The webhook URL is a file on the NAS (not in git).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    entrypoint:
      - /bin/sh
      - -c
      - export WEBHOOK_URL="$$(cat /run/secrets/webhook-url)"; exec /docker-entrypoint autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      - WEBHOOK_JSON_KEY=content
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/appdata/autoheal/webhook-url:/run/secrets/webhook-url:ro
    restart: always

  # Posts to Discord when a container with a restart policy has been stopped for 2+ minutes
  # (autoheal only handles unhealthy containers, not ones that exited, e.g. exit 128 last time)
  deadwatch:
    image: willfarrell/autoheal:latest
    container_name: deadwatch
    entrypoint:
      - /bin/sh
      - -c
      - |
        URL=$$(cat /run/secrets/webhook-url)
        S="--unix-socket /var/run/docker.sock"
        STATE=/tmp/alerted
        MIN_AGE=$${MIN_AGE:-120}
        touch $$STATE
        post() { curl -s -m 10 -X POST -H "Content-Type: application/json" -d "{\"content\":\"$$1\"}" "$$URL" > /dev/null; }
        while true; do
          curl -s $$S -g 'http://localhost/containers/json?all=true&filters={"status":["exited","dead"]}' | jq -r '.[].Id' | while read -r id; do
            info=$$(curl -s $$S "http://localhost/containers/$$id/json")
            pol=$$(echo "$$info" | jq -r '.HostConfig.RestartPolicy.Name')
            [ "$$pol" = "no" ] && continue
            age=$$(echo "$$info" | jq -r '(now - ((.State.FinishedAt[0:19] + "Z") | fromdateiso8601)) | floor')
            [ "$$age" -lt "$$MIN_AGE" ] && continue
            key="$$id $$(echo "$$info" | jq -r .State.FinishedAt)"
            grep -qF "$$key" $$STATE && continue
            echo "$$key" >> $$STATE
            name=$$(echo "$$info" | jq -r '.Name | ltrimstr("/")')
            code=$$(echo "$$info" | jq -r .State.ExitCode)
            err=$$(echo "$$info" | jq -r .State.Error | tr -d '"\\' | cut -c1-200)
            post "DOWN: $$name has stopped and not come back (exit code $$code, $${age}s ago). $$err"
          done
          sleep 60
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/appdata/autoheal/webhook-url:/run/secrets/webhook-url:ro
    restart: always

  # Moves non-English-original titles onto their "(foreign ok)" quality profile every 30 min
  # (and searches if they have no file), so foreign requests via Seerr are not blocked by the dub-tag rule
  profilesync:
    image: willfarrell/autoheal:latest
    container_name: profilesync
    entrypoint:
      - /bin/sh
      - -c
      - |
        URL=$$(cat /run/secrets/webhook-url)
        INTERVAL=$${INTERVAL:-1800}
        post() { [ -n "$$DRY" ] && { echo "$$1"; return; }; curl -s -m 10 -X POST -H "Content-Type: application/json" -d "{\"content\":\"$$1\"}" "$$URL" > /dev/null; }
        sync() {
          app=$$1; port=$$2; kind=$$3; idkey=$$4
          KEY=$$(grep -o '<ApiKey>[^<]*' /cfg/$$app.xml | cut -d'>' -f2)
          H="X-Api-Key: $$KEY"; U="http://$$app:$$port/api/v3"
          profiles=$$(curl -s -m 60 -H "$$H" $$U/qualityprofile)
          curl -s -m 180 -H "$$H" $$U/$$kind | jq -c --argjson p "$$profiles" '
            ($$p | map({(.name): .id}) | add) as $$ids
            | [ .[] | select((.originalLanguage.name // "English") != "English")
                | . as $$i | ($$p | map(select(.id == $$i.qualityProfileId)) | .[0].name) as $$pn
                | select($$pn != null and ($$pn | endswith(" (foreign ok)") | not))
                | select($$ids[$$pn + " (foreign ok)"] != null)
                | {id: .id, title: .title, twin: $$ids[$$pn + " (foreign ok)"], hasFile: ((.hasFile // false) or ((.statistics.episodeFileCount // 0) > 0))} ]' > /tmp/todo_$$app.json
          n=$$(jq 'length' /tmp/todo_$$app.json)
          [ "$$n" = "0" ] && return
          names=$$(jq -r 'map(.title) | join(", ")' /tmp/todo_$$app.json | cut -c1-300)
          if [ -z "$$DRY" ]; then
            jq -c 'group_by(.twin)[] | {ids: map(.id), twin: .[0].twin}' /tmp/todo_$$app.json | while read -r g; do
              body=$$(echo "$$g" | jq -c --arg k "$$idkey" '{($$k): .ids, qualityProfileId: .twin}')
              curl -s -m 60 -o /dev/null -H "$$H" -H "Content-Type: application/json" -X PUT "$$U/$$kind/editor" -d "$$body"
            done
            if [ "$$kind" = "movie" ]; then
              ids=$$(jq -c '[.[] | select(.hasFile | not) | .id]' /tmp/todo_$$app.json)
              [ "$$ids" != "[]" ] && curl -s -m 60 -o /dev/null -H "$$H" -H "Content-Type: application/json" -X POST "$$U/command" -d "{\"name\":\"MoviesSearch\",\"movieIds\":$$ids}"
            else
              for id in $$(jq -r '.[] | select(.hasFile | not) | .id' /tmp/todo_$$app.json); do
                curl -s -m 60 -o /dev/null -H "$$H" -H "Content-Type: application/json" -X POST "$$U/command" -d "{\"name\":\"SeriesSearch\",\"seriesId\":$$id}"
              done
            fi
          fi
          post "Profile sync ($$app): moved $$n foreign-language title(s) to the 'foreign ok' profile: $$names"
        }
        while true; do
          sync radarr 7878 movie movieIds
          sync sonarr 8989 series seriesIds
          [ -n "$$ONCE" ] && exit 0
          sleep "$$INTERVAL"
        done
    volumes:
      - /volume1/docker/appdata/radarr/config.xml:/cfg/radarr.xml:ro
      - /volume1/docker/appdata/sonarr/config.xml:/cfg/sonarr.xml:ro
      - /volume1/docker/appdata/autoheal/webhook-url:/run/secrets/webhook-url:ro
    restart: always

  # Nightly image updates for every container (replaces Portainer re-pulling every 5 min)
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      - TZ=Europe/London
      - WATCHTOWER_SCHEDULE=0 0 4 * * * # 04:00 daily
      - WATCHTOWER_CLEANUP=true # delete the old image after updating
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_TIMEOUT=60s
      - WATCHTOWER_DISABLE_CONTAINERS=portainer # Portainer is upgraded by hand
      - WATCHTOWER_NOTIFICATION_URL=/run/secrets/notification-url # file holds the Discord shoutrrr URL
      - WATCHTOWER_NOTIFICATION_REPORT=true # one summary message per run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/appdata/watchtower/notification-url:/run/secrets/notification-url:ro # secret lives on the NAS, not in git
    restart: always
