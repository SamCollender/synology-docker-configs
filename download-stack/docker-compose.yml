services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=Europe/London
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - OPENVPN_PROCESS_USER=root # VPN reconnects fail with "Cannot open TUN/TAP dev: Permission denied" as nonroot
    ports:
      - 8088:8088 # QBitTorrent GUI
      - 6881:6881 # QBitTorrent Torrents
      - 6881:6881/udp # QBitTorrent Torrents
      - 8080:8080 # Sabnzbd
      - 9696:9696 # Prowlarr
    restart: unless-stopped
    labels:
      - autoheal=true
    privileged: true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    healthcheck:
      test: /gluetun-entrypoint healthcheck
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun # service: (not container:) so compose recreates this when gluetun is recreated
    environment:
      - UMASK=022
      - TZ=Europe/London
      - WEBUI_PORT=8088
      - TORRENTING_PORT=6881
    volumes:
      - /volume1/docker/appdata/qbittorrent:/config
      - /volume1/data/media:/mnt/media
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    healthcheck: # fails when the shared gluetun network is gone, so autoheal restarts it
      test: curl -fsS -m 5 -o /dev/null https://1.1.1.1 || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: service:gluetun
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/sabnzbd:/config
      - /volume1/data/media:/mnt/media
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null https://1.1.1.1 || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - 7878:7878
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/radarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    labels:
      - autoheal=true
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null http://localhost:7878/ping || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
  
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release
    ports:
      - 8989:8989
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/sonarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    labels:
      - autoheal=true
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null http://localhost:8989/ping || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    ports:
      - 6767:6767
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/bazarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    network_mode: service:gluetun
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/prowlarr:/config:rw
    labels:
      - autoheal=true
      - com.centurylinklabs.watchtower.depends-on=gluetun
    healthcheck:
      test: curl -fsS -m 5 -o /dev/null https://1.1.1.1 || exit 1
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - 8191:8191
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      - 5055:5055
    environment:
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/overseerr:/app/config # existing Overseerr config, owned by 1000:1000
    labels:
      - autoheal=true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # Restarts any container labelled autoheal=true when its healthcheck reports unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  # Nightly image updates for every container (replaces Portainer re-pulling every 5 min)
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      - TZ=Europe/London
      - WATCHTOWER_SCHEDULE=0 0 4 * * * # 04:00 daily
      - WATCHTOWER_CLEANUP=true # delete the old image after updating
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_TIMEOUT=60s
      - WATCHTOWER_DISABLE_CONTAINERS=portainer # Portainer is upgraded by hand
      - WATCHTOWER_NOTIFICATION_URL=/run/secrets/notification-url # file holds the Discord shoutrrr URL
      - WATCHTOWER_NOTIFICATION_REPORT=true # one summary message per run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/appdata/watchtower/notification-url:/run/secrets/notification-url:ro # secret lives on the NAS, not in git
    restart: always
