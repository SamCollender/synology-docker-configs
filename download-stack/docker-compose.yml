services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=Europe/London
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - OPENVPN_PROCESS_USER=root # VPN reconnects fail with "Cannot open TUN/TAP dev: Permission denied" as nonroot
    ports:
      - 8088:8088 # QBitTorrent GUI
      - 6881:6881 # QBitTorrent Torrents
      - 6881:6881/udp # QBitTorrent Torrents
      - 8080:8080 # Sabnzbd
      - 9696:9696 # Prowlarr
    restart: unless-stopped
    privileged: true
    devices:
      - "/dev/net/tun:/dev/net/tun"
    healthcheck:
      test: /gluetun-entrypoint healthcheck
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: container:gluetun
    environment:
      - UMASK=022
      - TZ=Europe/London
      - WEBUI_PORT=8088
      - TORRENTING_PORT=6881
    volumes:
      - /volume1/docker/appdata/qbittorrent:/config
      - /volume1/data/media:/mnt/media
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: container:gluetun
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/sabnzbd:/config
      - /volume1/data/media:/mnt/media
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    ports:
      - 7878:7878
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/radarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
  
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release
    ports:
      - 8989:8989
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/sonarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    ports:
      - 6767:6767
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/bazarr:/config
      - /volume1/data/media:/mnt/media
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    network_mode: container:gluetun
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/prowlarr:/config:rw
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - 8191:8191
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=022
      - TZ=Europe/London
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: unless-stopped

  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      - 5055:5055
    environment:
      - TZ=Europe/London
    volumes:
      - /volume1/docker/appdata/overseerr:/app/config # existing Overseerr config, owned by 1000:1000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
