networks:
  management:
    name: management
    driver: bridge

services:
  portainer:
    image: portainer/portainer-ee:alpine
    container_name: portainer
    hostname: portainer
    networks:
      - management
    ports:
      - 9443:9443/tcp
    volumes:
      - /volume1/docker/appdata/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/@docker/volumes:/var/lib/docker/volume
    labels:
      - com.centurylinklabs.watchtower.enable=false # Portainer is upgraded by hand
    restart: always

  # Restarts any container labelled autoheal=true when its healthcheck reports unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  # Nightly image updates for every container (replaces Portainer re-pulling every 5 min)
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    environment:
      - TZ=Europe/London
      - WATCHTOWER_SCHEDULE=0 0 4 * * * # 04:00 daily
      - WATCHTOWER_CLEANUP=true # delete the old image after updating
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_TIMEOUT=60s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
